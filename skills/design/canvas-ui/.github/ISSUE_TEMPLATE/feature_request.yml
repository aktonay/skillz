name: Feature or component request
description: Suggest a new component or an improvement to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the effect or improvement. Links to references, videos, or sites with a similar effect are very welcome.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Where would you use it?
      description: What kind of page or interaction is this for?
